<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dine resultater · Color Polygraph · Andreas Lindeman</title>
  <meta name="description" content="Color Polygraph-resultater: se hva KI-en gjettet om kjønn, alder og humør fra 21 fargevelg." />
  <link rel="alternate" hreflang="en" href="https://ai.andreaslindeman.com/color-polygraph/survey-result" />
  <link rel="alternate" hreflang="no" href="https://ai.andreaslindeman.no/color-polygraph/survey-result" />
  <link rel="alternate" hreflang="x-default" href="https://ai.andreaslindeman.com/color-polygraph/survey-result" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    /* Full-bleed fullscreen immediately */
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    body .site-nav { flex-shrink: 0; }
    .rv-wrap {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* ---- Reveal slides ---- */
    .rv-slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 6vh, 72px) clamp(28px, 6vw, 96px);
      opacity: 0;
      transform: translateX(56px);
      transition: opacity 0.4s ease, transform 0.42s cubic-bezier(.22,.68,0,1.1);
      pointer-events: none;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .rv-slide.is-current {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .rv-slide.is-leaving {
      opacity: 0;
      transform: translateX(-56px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
    }
    /* ambient winner-color glow */
    .rv-slide::after {
      content: '';
      position: fixed;
      top: -100px; right: 0;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: var(--winner-color, transparent);
      opacity: 0.055;
      filter: blur(120px);
      pointer-events: none;
      z-index: -1;
    }

    /* step dots */
    .rv-dots {
      display: flex;
      gap: 10px;
      margin-bottom: 48px;
      align-items: center;
    }
    .rv-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--hairline-2);
      flex-shrink: 0;
      transition: background .35s ease, transform .35s ease;
    }
    .rv-dot.is-done { background: var(--text-dim); }
    .rv-dot.is-active { background: var(--hobby); transform: scale(1.35); }
    .rv-dot-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-left: 6px;
    }

    /* center (loading) */
    .rv-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      gap: 22px;
      text-align: center;
    }
    .rv-spinner {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2.5px solid var(--hairline-2);
      border-top-color: var(--hobby);
      animation: rv-spin 0.75s linear infinite;
    }
    @keyframes rv-spin { to { transform: rotate(360deg); } }
    .rv-loading-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0;
    }
    .rv-error {
      font-family: var(--mono);
      font-size: 11px;
      color: #d97b6a;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.7;
    }
    .rv-error a {
      color: var(--hobby);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* prediction display */
    .rv-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 14px;
    }
    .rv-big {
      font-family: var(--serif);
      font-style: italic;
      font-variation-settings: "opsz" 72, "SOFT" 60;
      font-size: clamp(52px, 11vw, 104px);
      line-height: 1;
      color: var(--hobby);
      margin: 0 0 12px;
    }
    .rv-conf {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0 0 36px;
    }
    .rv-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 2;
    }
    .rv-btn {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 11px 18px;
      border-radius: 2px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s, color .15s, background .15s;
    }
    .rv-btn.is-yes {
      background: rgba(245, 185, 92, 0.12);
      color: var(--hobby);
      border: 1px solid rgba(245, 185, 92, 0.4);
    }
    .rv-btn.is-yes:hover {
      background: rgba(245, 185, 92, 0.18);
      border-color: rgba(245, 185, 92, 0.6);
      transform: translateY(-1px);
    }
    .rv-btn.is-no {
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
    }
    .rv-btn.is-no:hover { color: var(--text); border-color: var(--hairline-2); }

    /* censored overlay — gender slide */
    .rv-censor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 36%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .rv-censor::before {
      content: '';
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px) saturate(0.2) brightness(0.6);
      -webkit-backdrop-filter: blur(20px) saturate(0.2) brightness(0.6);
      background: linear-gradient(to bottom, rgba(10,13,24,0.05) 0%, rgba(10,13,24,0.85) 100%);
    }
    .rv-censor-bar {
      position: absolute;
      left: 0; right: 0;
      top: 28%;
      height: 24px;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .rv-censor-bar span {
      font-family: var(--mono);
      font-size: 7px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.13);
    }

    /* age input */
    .rv-age-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .rv-age-wrap input[type="number"] {
      font-family: var(--mono);
      font-size: 32px;
      width: 96px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--hairline-2);
      border-radius: 3px;
      color: var(--hobby);
      text-align: center;
      appearance: textfield;
      -moz-appearance: textfield;
      -webkit-appearance: textfield;
      letter-spacing: 0.04em;
    }
    .rv-age-wrap input[type="number"]::-webkit-outer-spin-button,
    .rv-age-wrap input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; }
    .rv-age-wrap input[type="number"]:focus {
      outline: none;
      border-color: rgba(245, 185, 92, 0.5);
    }
    .rv-hint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    /* mood slider */
    .rv-slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
      max-width: 380px;
    }
    .rv-slider-wrap input[type="range"] {
      width: 100%;
      accent-color: var(--hobby);
      cursor: pointer;
    }
    .rv-slider-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* stats slide */
    .rv-stats-layout {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 28px;
      align-items: start;
      margin-bottom: 24px;
    }
    .rv-winner-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid var(--hairline);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .rv-winner-hex {
      font-family: var(--mono);
      font-size: 26px;
      letter-spacing: 0.05em;
      color: var(--hobby);
      margin: 0 0 4px;
    }
    .rv-winner-rgb {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-mute);
      margin: 0 0 18px;
    }
    .rv-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }
    .rv-pill {
      padding: 4px 11px;
      border: 1px solid var(--hairline-2);
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      color: var(--text-mute);
      background: var(--surface);
    }
    .rv-pill b { color: var(--hobby); font-weight: 500; }
    .rv-hue-strip {
      display: flex;
      height: 6px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
      border: 1px solid var(--hairline);
    }
    .rv-hue-strip-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      margin: 0 0 24px;
    }
    .rv-score {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--text-mute);
      margin: 0 0 20px;
    }
    .rv-score b { color: var(--hobby); }
    .rv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .rv-retake {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 13px 28px;
      background: var(--hobby);
      color: var(--bg);
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 500;
      transition: transform .15s ease, filter .15s ease;
      box-shadow: 0 6px 20px rgba(245, 185, 92, 0.2);
    }
    .rv-retake:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .rv-share {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 13px 20px;
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .rv-share:hover { color: var(--text); border-color: var(--hairline-2); }
    .rv-share-toast {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--hobby);
    }

    /* color fingerprint */
    .rv-fingerprint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0 0 14px;
    }
    .rv-fingerprint b {
      color: var(--hobby);
      font-weight: 500;
    }

    /* taste contrast (drawn to / passed over) */
    .rv-taste {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      margin: 6px 0 26px;
    }
    .rv-taste-head {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 10px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .rv-taste-count {
      color: var(--text-mute);
      font-size: 8.5px;
      letter-spacing: 0.1em;
    }
    .rv-taste-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .rv-taste-grid i {
      display: block;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .rv-taste-grid i.is-fav {
      outline: 1.5px solid var(--hobby);
      outline-offset: 1.5px;
    }
    .rv-taste-grid.is-rejected {
      opacity: 0.5;
    }
    .rv-taste-grid.is-rejected i {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      filter: saturate(0.7);
    }

    /* The stats slide grew tall (cube + taste grids): top-align it. */
    .rv-slide.rv-stats-slide { justify-content: flex-start; }

    /* ---- personal colour cube (embedded in the stats slide) ---- */
    .rv-cube-embed {
      max-width: 780px;
      margin: 10px auto 34px;
      padding: 18px 18px 16px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 6px;
    }
    .rv-cube-eyebrow {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .rv-cube-legend {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: none;
      color: var(--text-mute);
    }
    .rv-cube-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: radial-gradient(circle at 50% 45%, #131829 0%, #060810 80%);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      overflow: hidden;
    }
    .rv-cube-canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    .rv-cube-canvas-wrap canvas:active { cursor: grabbing; }
    /* Loading veil over the cube: hide the early noise behind the (identical)
       empty stage + a spinner until enough points have accumulated. */
    .rv-cube-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 50% 45%, #131829 0%, #060810 80%);
      transition: opacity 0.6s ease;
    }
    .rv-cube-loading.is-hidden { opacity: 0; pointer-events: none; }
    .rv-cube-axes {
      position: absolute;
      top: 12px;
      left: 14px;
      display: flex;
      gap: 12px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--text-mute);
      pointer-events: none;
    }
    .rv-cube-axes span::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      margin-right: 5px;
      vertical-align: 1px;
      border-radius: 50%;
    }
    .rv-cube-axes .ax-r::before { background: #ff6464; }
    .rv-cube-axes .ax-g::before { background: #66dd6e; }
    .rv-cube-axes .ax-b::before { background: #6aa6ff; }
    /* compare row */
    .rv-cube-compare {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--hairline);
    }
    .rv-cube-compare-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-right: 2px;
    }
    .rv-cmp-btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 12px;
      border-radius: 2px;
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .rv-cmp-btn:hover { color: var(--text); border-color: var(--hairline-2); }
    .rv-cmp-btn.is-active {
      background: rgba(245, 185, 92, 0.12);
      color: var(--hobby);
      border-color: rgba(245, 185, 92, 0.4);
    }
    .rv-cmp-id-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .rv-cmp-id-wrap input {
      font-family: var(--mono);
      font-size: 10px;
      width: 150px;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--hairline);
      border-radius: 2px;
      color: var(--text);
      letter-spacing: 0.04em;
    }
    .rv-cmp-id-wrap input:focus {
      outline: none;
      border-color: rgba(245, 185, 92, 0.5);
    }
    .rv-cmp-kind {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-left: auto;
      padding-left: 10px;
      border-left: 1px solid var(--hairline);
    }
    .rv-cmp-status {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      flex-basis: 100%;
    }
    .rv-cmp-status.is-error { color: #d97b6a; }
    .rv-cmp-warn {
      flex-basis: 100%;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      line-height: 1.6;
      color: rgba(245, 185, 92, 0.75);
    }
    .rv-cmp-warn a {
      color: var(--hobby);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    /* likeness / fun facts row, shown while comparing */
    .rv-cmp-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--hairline);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-mute);
    }
    .rv-cmp-meta b {
      color: var(--hobby);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .rv-cmp-meta i {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 3px;
      vertical-align: -2px;
      margin-left: 5px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .rv-cube-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0 0;
    }
    .rv-cube-progress-track {
      flex: 1 1 auto;
      height: 4px;
      border-radius: 2px;
      background: var(--hairline-2);
      overflow: hidden;
    }
    .rv-cube-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--hobby);
      border-radius: 2px;
      transition: width 0.18s ease;
    }
    .rv-cube-progress-label {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .rv-cube-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
    }
    .rv-cube-toggle { display: flex; gap: 8px; }
    .rv-cube-toggle .rv-btn[aria-pressed="false"] {
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
    }

    @media (max-width: 600px) {
      .rv-stats-layout { grid-template-columns: 1fr; }
      .rv-winner-swatch { max-width: 130px; }
      .rv-big { font-size: clamp(44px, 18vw, 80px); }
      .rv-slide { padding: 20px 20px; }
      .rv-dots { margin-bottom: 32px; }
      .rv-taste { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>

  <div class="rv-wrap" id="rvWrap"></div>

  <!-- Cube scripts live on the .com AI subdomain (no local copy here); the
       gender/age/mood models are already loaded from there too. -->
  <script src="https://ai.andreaslindeman.com/color-polygraph/models-js/tree_walker.js?v=2"></script>
  <script src="https://ai.andreaslindeman.com/color-polygraph/models-js/taste_features.js?v=2"></script>
  <script src="https://ai.andreaslindeman.com/color-polygraph/models-js/pick_features.js?v=2"></script>
  <script src="https://ai.andreaslindeman.com/color-polygraph/models-js/pick_cube.js?v=8"></script>
  <script>
  (function () {
    const DEFAULT_API_URL = 'https://api.andreaslindeman.com/color-polygraph';
    const API_URL = (function () {
      try {
        const p = new URLSearchParams(window.location.search);
        if (p.get('api')) return p.get('api').replace(/\/$/, '');
      } catch (_e) {}
      return (typeof window !== 'undefined' && window.COLOR_POLYGRAPH_API)
        ? window.COLOR_POLYGRAPH_API.replace(/\/$/, '')
        : DEFAULT_API_URL;
    })();
    const MODELS_BASE = 'https://ai.andreaslindeman.com/color-polygraph/models-js/';
    const MODEL_CACHE = Object.create(null);

    // How many fresh survey questions the pick model answers for the colour
    // cube (single source of truth in pick_cube.js); override with ?answers=NNNN.
    const CUBE_ANSWERS = (function () {
      try {
        const v = parseInt(new URLSearchParams(window.location.search).get('answers'), 10);
        if (v > 0) return v;
      } catch (_e) {}
      return PickCube.TOTAL_ANSWERS;
    })();

    function loadModel(name) {
      if (MODEL_CACHE[name]) return MODEL_CACHE[name];
      const url = MODELS_BASE + name + '_trees.json';
      MODEL_CACHE[name] = TreeWalker.load(url).catch(err => { delete MODEL_CACHE[name]; throw err; });
      return MODEL_CACHE[name];
    }

    async function postJson(path, body) {
      const r = await fetch(API_URL + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.json()).error || ''; } catch (_e) {}
        throw new Error('HTTP ' + r.status + (detail ? ' - ' + detail : ''));
      }
      return r.json();
    }

    async function getJson(path) {
      const r = await fetch(API_URL + path);
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.json()).error || ''; } catch (_e) {}
        throw new Error('HTTP ' + r.status + (detail ? ' - ' + detail : ''));
      }
      return r.json();
    }

    // ---- Slide engine ----
    const wrap = document.getElementById('rvWrap');
    let _current = null;
    let _cubeController = null;  // running cube render loop, if any

    function goSlide(buildFn) {
      if (_current) {
        const old = _current;
        old.classList.remove('is-current');
        old.classList.add('is-leaving');
        setTimeout(() => { if (old.parentNode) old.remove(); }, 400);
        _current = null;
      }
      const s = document.createElement('div');
      s.className = 'rv-slide';
      wrap.appendChild(s);
      buildFn(s);
      requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('is-current')));
      _current = s;
      return s;
    }

    function makeDots(activeKey) {
      const steps = ['kjønn', 'alder', 'humør', 'statistikk'];
      const ai = steps.indexOf(activeKey);
      return '<div class="rv-dots">' +
        steps.map((s, i) => '<span class="rv-dot' + (i < ai ? ' is-done' : i === ai ? ' is-active' : '') + '"></span>').join('') +
        '<span class="rv-dot-label">' + activeKey + '</span>' +
        '</div>';
    }

    function moodLabel(v) {
      if (v >= 45) return 'glad';
      if (v >= 30) return 'ok';
      if (v >= 15) return 'litt nede';
      return 'trist';
    }

    function rgbToHsl([r, g, b]) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      if (max === min) return [0, 0, Math.round(l * 100)];
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      let h;
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        default: h = ((r - g) / d + 4) / 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    function buildHueStrip(history) {
      const allPicks = [];
      history.forEach(round => round.forEach(p => allPicks.push(p.winner)));
      const sorted = allPicks.slice().sort((a, b) => rgbToHsl(a.rgb)[0] - rgbToHsl(b.rgb)[0]);
      const chips = sorted.map(c => '<div style="flex:1;min-width:2px;background:' + c.hex + '"></div>').join('');
      return '<div class="rv-hue-strip">' + chips + '</div><p class="rv-hue-strip-label">Alle valgene dine sortert etter fargetone</p>';
    }

    function paletteTone(history) {
      const picks = [];
      history.forEach(round => round.forEach(p => picks.push(p.winner.rgb)));
      if (!picks.length) return 'blandet';
      const avg = picks.reduce((s, rgb) => s + rgbToHsl(rgb)[0], 0) / picks.length;
      return avg < 50 || avg > 310 ? 'varm' : avg > 140 && avg < 270 ? 'kald' : 'blandet';
    }

    // Deler hver farge surveyet viste i to: de brukeren stadig valgte (vinnere)
    // og de som ble valgt bort (vist, men aldri plukket). Vekten til en farge
    // vokser jo lenger den kom, slik at totalvinneren teller mest. Fungerer for
    // begge lengder: history har samme struktur.
    function collectTaste(history) {
      const winnerHex = new Set();
      const likedMap = new Map();   // hex -> { color, weight }
      history.forEach((round, ri) => {
        round.forEach(q => {
          if (!q || !q.winner) return;
          winnerHex.add(q.winner.hex);
          const e = likedMap.get(q.winner.hex);
          if (e) e.weight += ri + 1;
          else likedMap.set(q.winner.hex, { color: q.winner, weight: ri + 1 });
        });
      });
      const rejectedMap = new Map();
      history.forEach(round => {
        round.forEach(q => {
          (q && q.options || []).forEach(o => {
            if (!winnerHex.has(o.hex) && !rejectedMap.has(o.hex)) rejectedMap.set(o.hex, o);
          });
        });
      });
      const byHue = (a, b) => rgbToHsl((a.color || a).rgb)[0] - rgbToHsl((b.color || b).rgb)[0];
      return {
        liked: [...likedMap.values()].sort(byHue),
        rejected: [...rejectedMap.values()].sort(byHue),
      };
    }

    // Vektet lesning av fargene brukeren ble tiltrukket av, på tre akser:
    // temperatur, metning, lyshet. Returnerer nøkkelstrenger; kalleren oversetter
    // dem til visningsord, slik at samme logikk kan brukes på begge språk.
    function colorFingerprint(taste) {
      const liked = taste.liked;
      if (!liked.length) return null;
      let wsum = 0, Lsum = 0, Ssum = 0, warm = 0, cool = 0;
      liked.forEach(({ color, weight }) => {
        const [h, s, l] = rgbToHsl(color.rgb);
        wsum += weight; Lsum += l * weight; Ssum += s * weight;
        if (h < 60 || h >= 300) warm += weight;
        else if (h >= 150 && h < 270) cool += weight;
      });
      const L = Lsum / wsum, S = Ssum / wsum;
      return {
        temp: warm > cool * 1.2 ? 'warm' : cool > warm * 1.2 ? 'cool' : 'balanced',
        sat: S >= 58 ? 'vivid' : S <= 28 ? 'muted' : 'soft',
        light: L >= 62 ? 'bright' : L <= 38 ? 'dark' : 'medium',
      };
    }

    function buildTasteSection(history, favHex) {
      const t = collectTaste(history);
      if (!t.liked.length && !t.rejected.length) return '';
      const fav = (favHex || '').toLowerCase();
      const likedCells = t.liked.map(({ color }) =>
        '<i class="' + (color.hex.toLowerCase() === fav ? 'is-fav' : '') + '" style="background:' + color.hex + '"></i>'
      ).join('');
      const rejCells = t.rejected.map(c => '<i style="background:' + c.hex + '"></i>').join('');
      return '<div class="rv-taste">' +
        '<div class="rv-taste-col">' +
          '<p class="rv-taste-head">Tiltrukket av <span class="rv-taste-count">' + t.liked.length + '</span></p>' +
          '<div class="rv-taste-grid">' + likedCells + '</div>' +
        '</div>' +
        '<div class="rv-taste-col">' +
          '<p class="rv-taste-head">Valgte bort <span class="rv-taste-count">' + t.rejected.length + '</span></p>' +
          '<div class="rv-taste-grid is-rejected">' + rejCells + '</div>' +
        '</div>' +
      '</div>';
    }

    function fingerprintPhrase(history) {
      const fp = colorFingerprint(collectTaste(history));
      if (!fp) return null;
      const T = { warm: 'varm', cool: 'kjølig', balanced: 'balansert' };
      const Sm = { vivid: 'sterk', soft: 'dempet', muted: 'matt' };
      const Lm = { bright: 'lys', medium: 'medium', dark: 'mørk' };
      const t = T[fp.temp];
      return t.charAt(0).toUpperCase() + t.slice(1) + ', ' + Sm[fp.sat] + ', ' + Lm[fp.light];
    }

    function buildPayload(savedState) {
      // Bracket columns are consistent across both variants: offered = every
      // colour shown in round 0, r1/r2(/r3) = the winners after each round, and
      // final = the single winner of the last round.
      //   short (3 rounds): offered(64) -> r1(16) -> r2(4) -> final
      //   long  (4 rounds): offered(256) -> r1(64) -> r2(16) -> r3(4) -> final
      const history = savedState.history;
      const offered = [];
      history[0].forEach(step => step.options.forEach(c => offered.push(c.rgb)));
      const finalRound = history[history.length - 1];
      const payload = {
        offered,
        r1: history[0].map(s => s.winner.rgb),
        r2: history[1].map(s => s.winner.rgb),
        final: finalRound[0].winner.rgb,
        valg: savedState.picks.map(p => String(p.position)).join(''),
        tider: savedState.picks.map(p => p.cumulativeMs),
      };
      if (savedState.long) {
        payload.r3 = history[2].map(s => s.winner.rgb);
        payload.long = true;
      }
      return payload;
    }

    function buildMetadata(savedState) {
      const ua = navigator.userAgent || '';
      const isMobile = /Mobi|Android|iPhone|iPad|iPod|IEMobile|Opera Mini/.test(ua)
        || (navigator.maxTouchPoints > 0 && window.matchMedia('(pointer: coarse)').matches);
      let timezone = '';
      try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (_e) {}
      return {
        client_started_at: savedState.startMs,
        client_submitted_at: Date.now(),
        client_local_time: new Date().toISOString(),
        user_agent: ua,
        referrer: document.referrer || '',
        language: navigator.language || '',
        locale: (navigator.languages || []).join(','),
        is_mobile: isMobile,
        screen_w: window.screen ? window.screen.width : null,
        screen_h: window.screen ? window.screen.height : null,
        viewport_w: window.innerWidth,
        viewport_h: window.innerHeight,
        timezone_client: timezone,
      };
    }

    function showStatsSlide(opts) {
      const { w, confirmedGender, confirmedAge, confirmedMood, score, history, picks, fromId, long, features } = opts;
      // Fargekuben trenger prod-feature-vektorene (ferske fra POST /survey, eller
      // regenerert av GET /survey/:id). Korte og lange surveyer har hver sin pick-modell.
      const canCube = !!history && !!(features && features.gender);
      const pickCount = picks && picks.length ? picks.length : null;
      const totalMs = picks && picks.length ? picks[picks.length - 1].cumulativeMs : 0;
      const totalS = Math.round(totalMs / 1000);
      const timeStr = totalS >= 60 ? Math.floor(totalS / 60) + 'm ' + (totalS % 60) + 's' : totalS > 0 ? totalS + 's' : '—';
      const shareUrl = window.location.origin + window.location.pathname + window.location.search;
      const phrase = history ? fingerprintPhrase(history) : null;

      const pillsHtml = [
        confirmedGender ? '<span class="rv-pill">Kjønn <b>' + confirmedGender + '</b></span>' : '',
        confirmedAge != null ? '<span class="rv-pill">Alder <b>' + confirmedAge + '</b></span>' : '',
        confirmedMood != null ? '<span class="rv-pill">Humør <b>' + moodLabel(confirmedMood) + '</b></span>' : '',
        timeStr !== '—' ? '<span class="rv-pill">Tid <b>' + timeStr + '</b></span>' : '',
      ].join('');

      goSlide(s => {
        s.classList.add('rv-stats-slide');
        s.innerHTML =
          makeDots('statistikk') +
          '<div class="rv-stats-layout">' +
            '<div class="rv-winner-swatch" style="background:' + w.hex + '"></div>' +
            '<div>' +
              '<p class="rv-eyebrow">Din favorittfarge</p>' +
              '<p class="rv-winner-hex">' + w.hex.toUpperCase() + '</p>' +
              '<p class="rv-winner-rgb">rgb(' + w.rgb[0] + ', ' + w.rgb[1] + ', ' + w.rgb[2] + ')</p>' +
              (phrase ? '<p class="rv-fingerprint">Paletten din er <b>' + phrase + '</b></p>' : '') +
              '<div class="rv-pills">' + pillsHtml + '</div>' +
              (history ? buildHueStrip(history) : '') +
            '</div>' +
          '</div>' +
          (canCube ?
            '<div class="rv-cube-embed">' +
              '<p class="rv-cube-eyebrow">Fargekube<span class="rv-cube-legend" id="rvCubeLegend"></span></p>' +
              '<div class="rv-cube-canvas-wrap">' +
                '<canvas id="rvCubeCanvas"></canvas>' +
                '<div class="rv-cube-axes"><span class="ax-r">R</span><span class="ax-g">G</span><span class="ax-b">B</span></div>' +
                '<div class="rv-cube-loading" id="rvCubeLoading"><div class="rv-spinner"></div><p class="rv-loading-label">Tegner fargekuben din…</p></div>' +
              '</div>' +
              '<div class="rv-cube-progress" id="rvCubeProgress">' +
                '<div class="rv-cube-progress-track"><div class="rv-cube-progress-fill" id="rvCubeFill"></div></div>' +
                '<span class="rv-cube-progress-label" id="rvCubeLabel">laster modell…</span>' +
              '</div>' +
              '<div class="rv-cube-controls">' +
                '<div class="rv-cube-toggle">' +
                  '<button type="button" class="rv-btn is-yes" id="rvCubeLiked" aria-pressed="true">Tiltrukket av</button>' +
                  '<button type="button" class="rv-btn is-no" id="rvCubeRej" aria-pressed="false">Valgte bort</button>' +
                '</div>' +
              '</div>' +
              '<div class="rv-cube-compare">' +
                '<span class="rv-cube-compare-label">Sammenlign</span>' +
                '<button type="button" class="rv-cmp-btn is-active" id="rvCmpOff">Bare meg</button>' +
                '<button type="button" class="rv-cmp-btn" id="rvCmpMan">Typisk mann</button>' +
                '<button type="button" class="rv-cmp-btn" id="rvCmpWoman">Typisk kvinne</button>' +
                '<span class="rv-cmp-id-wrap">' +
                  '<input type="text" id="rvCmpId" placeholder="survey-id eller lenke…" spellcheck="false">' +
                  '<button type="button" class="rv-cmp-btn" id="rvCmpGo">Kjør</button>' +
                '</span>' +
                '<span class="rv-cmp-kind" id="rvCmpKind" style="display:none">' +
                  '<button type="button" class="rv-cmp-btn is-active" id="rvCmpDiff">Forskjell</button>' +
                  '<button type="button" class="rv-cmp-btn" id="rvCmpSame">Til felles</button>' +
                '</span>' +
                '<span class="rv-cmp-status" id="rvCmpStatus" style="display:none"></span>' +
                '<span class="rv-cmp-warn" id="rvCmpWarn" style="display:none">' +
                  'Obs: korte tester er mindre nøyaktige enn lange. ' +
                  '<a href="survey?type=long">Ta den lange testen</a> for en skarpere sammenligning.' +
                '</span>' +
              '</div>' +
              '<div class="rv-cmp-meta" id="rvCmpMeta" style="display:none"></div>' +
            '</div>'
          : '') +
          (history ? buildTasteSection(history, w.hex) : '') +
          (score != null ? '<p class="rv-score">Modellen fikk <b>' + score + ' av 3</b> riktig.</p>' : '') +
          '<div class="rv-actions">' +
            '<button type="button" class="rv-retake" id="rvRetake">Ta surveyet på nytt</button>' +
            '<button type="button" class="rv-share" id="rvShare">Del resultater</button>' +
            '<span class="rv-share-toast" id="rvToast" style="display:none">Lenke kopiert</span>' +
          '</div>' +
          (long ? '' :
            '<p style="font-family:var(--mono);font-size:11px;letter-spacing:0.03em;color:var(--text-mute);margin:20px 0 0;line-height:1.6">' +
            'Vil du ha et skarpere resultat? <a href="survey?type=long" style="color:var(--hobby);text-decoration:underline;text-underline-offset:3px">Ta den lange testen</a> — den er svært nøyaktig.</p>') +
          '<a href="https://andreaslindeman.no/projects/color-polygraph" class="project-back" style="display:inline-block;margin-top:18px">Mer om prosjektet</a>';

        s.querySelector('#rvRetake').addEventListener('click', () => {
          window.location.href = long ? 'survey?type=long' : 'survey?type=short';
        });

        // Colour cube: the pick model retakes the survey live, filling the
        // cube as it answers; the bar below it tracks progress.
        if (canCube) {
          const progress = s.querySelector('#rvCubeProgress');
          const fill = s.querySelector('#rvCubeFill');
          const label = s.querySelector('#rvCubeLabel');
          const liked = s.querySelector('#rvCubeLiked');
          const rej = s.querySelector('#rvCubeRej');
          const cubeLoading = s.querySelector('#rvCubeLoading');
          // Keep the veil up until the cube has enough points to read cleanly.
          const CUBE_REVEAL_AT = Math.min(20000, CUBE_ANSWERS);

          if (_cubeController) { _cubeController.stop(); _cubeController = null; }
          let refreshMeta = () => {};  // assigned by the compare block below
          // bump ?v= on retrain (model JSON is force-cached)
          const pickModelUrl = (isLong) => MODELS_BASE + (isLong ? 'pick_long_trees.json?v=1' : 'pick_trees.json?v=2');
          PickCube.mount(s.querySelector('#rvCubeCanvas'), {
            history,
            features,
            long: !!long,
            modelUrl: pickModelUrl(long),
            totalAnswers: CUBE_ANSWERS,
            onProgress: (answered, total) => {
              fill.style.width = (answered / total * 100).toFixed(1) + '%';
              label.textContent = answered.toLocaleString('no-NO') + ' / ' + total.toLocaleString('no-NO');
              if (cubeLoading && answered >= CUBE_REVEAL_AT) cubeLoading.classList.add('is-hidden');
            },
            onDone: () => { progress.style.display = 'none'; if (cubeLoading) cubeLoading.classList.add('is-hidden'); refreshMeta(); },
          }).then(controller => {
            _cubeController = controller;
          }).catch(err => {
            console.warn('cube build failed', err);
            label.textContent = 'kuben er utilgjengelig';
          });

          const setMode = (inv) => {
            if (_cubeController) _cubeController.setInverted(inv);
            liked.setAttribute('aria-pressed', String(!inv));
            rej.setAttribute('aria-pressed', String(inv));
            liked.className = 'rv-btn ' + (inv ? 'is-no' : 'is-yes');
            rej.className = 'rv-btn ' + (inv ? 'is-yes' : 'is-no');
          };
          liked.addEventListener('click', () => setMode(false));
          rej.addEventListener('click', () => setMode(true));

          // -- compare: vs typical man / typical woman (population data) or vs
          //    another survey id (simulated with the same model, rendering live).
          const POP_URL = 'https://andreaslindeman.no/projects_data/2020-color-polygraph/summary.json';
          const legend = s.querySelector('#rvCubeLegend');
          const cmpStatus = s.querySelector('#rvCmpStatus');
          const cmpOff = s.querySelector('#rvCmpOff');
          const cmpMan = s.querySelector('#rvCmpMan');
          const cmpWoman = s.querySelector('#rvCmpWoman');
          const cmpGo = s.querySelector('#rvCmpGo');
          const cmpInput = s.querySelector('#rvCmpId');
          const cmpKindWrap = s.querySelector('#rvCmpKind');
          const cmpDiff = s.querySelector('#rvCmpDiff');
          const cmpSame = s.querySelector('#rvCmpSame');
          const cmpButtons = [cmpOff, cmpMan, cmpWoman, cmpGo];
          const cmpMeta = s.querySelector('#rvCmpMeta');
          const cmpWarn = s.querySelector('#rvCmpWarn');
          let popPromise = null;
          const cmpIdCache = Object.create(null);  // id -> {counts, isLong}
          let cmpToken = 0;     // latest-wins: stale async results are dropped
          let cmpCounts = null; // active comparison target
          let cmpWho = '';
          let cmpKind = 'diff';

          // Accept either a bare survey id or a pasted URL with ?id= / ?id2=.
          const parseSurveyId = (raw) => {
            const v = (raw || '').trim();
            const m = v.match(/[?&]id2?=([^&#\s]+)/);
            return m ? decodeURIComponent(m[1]) : v;
          };

          const setStatus = (msg, isError) => {
            cmpStatus.style.display = msg ? '' : 'none';
            cmpStatus.textContent = msg || '';
            cmpStatus.classList.toggle('is-error', !!isError);
          };
          // Accuracy note for id comparisons where either side is a short survey.
          const setWarn = (show) => { cmpWarn.style.display = show ? '' : 'none'; };
          const swatch = (hex) => '<i style="background:' + hex + '" title="' + hex + '"></i>';
          refreshMeta = () => {
            if (!cmpCounts || !_cubeController || !_cubeController.counts) {
              cmpMeta.style.display = 'none';
              cmpMeta.innerHTML = '';
              return;
            }
            const st = PickCube.compareStats(_cubeController.counts, cmpCounts);
            cmpMeta.innerHTML =
              '<span>Likhet <b>' + st.percent + '%</b></span>' +
              '<span>Begge liker' + swatch(st.bothLikeHex) + '</span>' +
              '<span>Begge hopper over' + swatch(st.bothHateHex) + '</span>' +
              '<span>Du liker, de hopper over' + swatch(st.youLikeHex) + '</span>' +
              '<span>De liker, du hopper over' + swatch(st.theyLikeHex) + '</span>';
            cmpMeta.style.display = '';
          };
          // Keep the stats live while either side's simulation is still filling in.
          setInterval(() => { if (cmpCounts) refreshMeta(); }, 600);
          const refreshCompare = () => {
            if (_cubeController) _cubeController.setCompare(cmpCounts, cmpKind);
            legend.textContent = !cmpCounts ? ''
              : cmpKind === 'same' ? ('hva du og ' + cmpWho + ' er enige om')
              : ('● deg · ▲ ' + cmpWho);
            cmpKindWrap.style.display = cmpCounts ? '' : 'none';
            cmpDiff.classList.toggle('is-active', cmpKind === 'diff');
            cmpSame.classList.toggle('is-active', cmpKind === 'same');
            refreshMeta();
          };
          const applyCompare = (counts, who, btn) => {
            cmpCounts = counts;
            cmpWho = who;
            cmpButtons.forEach(b => b.classList.toggle('is-active', b === btn));
            refreshCompare();
          };
          cmpDiff.addEventListener('click', () => { cmpKind = 'diff'; refreshCompare(); });
          cmpSame.addEventListener('click', () => { cmpKind = 'same'; refreshCompare(); });

          const loadPop = () => {
            if (!popPromise) {
              popPromise = fetch(POP_URL).then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
              }).catch(err => { popPromise = null; throw err; });
            }
            return popPromise;
          };
          const compareGender = async (key, who, btn) => {
            const tok = ++cmpToken;
            setStatus('laster befolkningsdata…');
            try {
              const pop = await loadPop();
              if (tok !== cmpToken) return;
              applyCompare(PickCube.countsFromPopulation(pop.buckets[key].v), who, btn);
              setStatus('');
            } catch (err) {
              console.warn('population data failed', err);
              if (tok === cmpToken) setStatus('kunne ikke laste befolkningsdata', true);
            }
          };

          cmpOff.addEventListener('click', () => {
            cmpToken++;
            setStatus('');
            setWarn(false);
            applyCompare(null, '', cmpOff);
          });
          cmpMan.addEventListener('click', () => { setWarn(false); compareGender('g_all', 'typisk mann', cmpMan); });
          cmpWoman.addEventListener('click', () => { setWarn(false); compareGender('j_all', 'typisk kvinne', cmpWoman); });

          const compareId = async () => {
            const otherId = parseSurveyId(cmpInput.value);
            if (!otherId) { cmpInput.focus(); return; }
            // Reflect the stripped id back so a pasted link shows what was used.
            if (cmpInput.value.trim() !== otherId) cmpInput.value = otherId;
            const tok = ++cmpToken;
            const whoLabel = 'id ' + otherId.slice(0, 8) + '…';
            try {
              const cached = cmpIdCache[otherId];
              if (cached) {
                applyCompare(cached.counts, whoLabel, cmpGo);
                setWarn(!long || !cached.isLong);
                setStatus('');
                return;
              }
              setStatus('henter survey…');
              const d = await getJson('/survey/' + encodeURIComponent(otherId));
              if (tok !== cmpToken) return;
              if (!d.features || !d.history) { setStatus('den surveyen har ingen modelldata', true); return; }
              // The other survey simulates with ITS OWN length + model.
              const sim = await PickCube.simulateCounts({
                history: d.history,
                features: d.features,
                long: !!d.long_survey,
                modelUrl: pickModelUrl(d.long_survey),
                totalAnswers: CUBE_ANSWERS,
                onProgress: (a, t) => {
                  if (tok === cmpToken) setStatus('simulerer deres survey… ' + a.toLocaleString('no-NO') + ' / ' + t.toLocaleString('no-NO'));
                },
                isStopped: () => tok !== cmpToken,
              });
              if (tok !== cmpToken) return;
              applyCompare(sim.counts, whoLabel, cmpGo);
              setWarn(!long || !d.long_survey);
              sim.done.then(() => {
                cmpIdCache[otherId] = { counts: sim.counts, isLong: !!d.long_survey };
                if (tok === cmpToken) setStatus('');
              });
            } catch (err) {
              console.warn('compare id failed', err);
              if (tok === cmpToken) setStatus('kunne ikke laste den survey-id-en', true);
            }
          };
          cmpGo.addEventListener('click', compareId);
          cmpInput.addEventListener('keydown', e => { if (e.key === 'Enter') compareId(); });

          // ?id2=<survey id> starts the cube in difference mode against that
          // survey right away (shareable comparison link).
          try {
            const id2 = new URLSearchParams(window.location.search).get('id2');
            if (id2) { cmpInput.value = id2; compareId(); }
          } catch (_e) {}
        }

        s.querySelector('#rvShare').addEventListener('click', () => {
          const picksStr = pickCount ? pickCount + ' fargevalg' : 'fargevalg alene';
          const tasteStr = phrase ? 'Fargesmaken min er ' + phrase.toLowerCase() + ', bygget rundt ' + w.hex.toUpperCase() + '.'
                                  : 'Min favorittfarge er ' + w.hex.toUpperCase() + '.';
          const guessStr = ' Color Polygraph-KI-en leste kjønn, alder og humør fra ' + picksStr +
                           (score != null ? ' og fikk ' + score + '/3' : '') + '. Hva sier din?';
          const shareData = {
            title: 'Color Polygraph',
            text: tasteStr + guessStr,
            url: shareUrl,
          };
          const toast = s.querySelector('#rvToast');
          if (navigator.share) {
            navigator.share(shareData).catch(() => {});
            return;
          }
          const text = shareData.text + ' ' + shareData.url;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
              toast.style.display = '';
              setTimeout(() => { toast.style.display = 'none'; }, 2400);
            }).catch(() => window.prompt('Kopier lenke:', text));
          } else {
            window.prompt('Kopier lenke:', text);
          }
        });
      });
    }

    // ---- ID-based flow (shared link) ----
    async function runIdFlow(id) {
      goSlide(s => {
        s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Laster resultater…</p></div>';
      });

      let data;
      try {
        data = await getJson('/survey/' + encodeURIComponent(id));
      } catch (err) {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><p class="rv-error">Kunne ikke laste resultater for denne ID-en.<br><a href="survey">Ta surveyet</a></p></div>';
        });
        return;
      }

      const w = { hex: data.winner_hex, rgb: data.winner_rgb };
      document.documentElement.style.setProperty('--winner-color', w.hex);

      showStatsSlide({
        w,
        // API returns canonical English; map back to the Norwegian display word.
        confirmedGender: { 'man': 'mann', 'woman': 'kvinne', 'non-binary': 'ikke-binær' }[data.confirmed_gender] || data.confirmed_gender,
        confirmedAge: data.confirmed_age,
        confirmedMood: data.confirmed_mood,
        score: data.correct_count,
        history: data.history || null,
        picks: data.picks || null,
        fromId: true,
        long: !!data.long_survey,
        features: data.features || null,
      });
    }

    // ---- Full interactive reveal flow ----
    async function runRevealFlow(savedState) {
      const isLong = !!savedState.long;
      // The long survey has its own trained heads; model names carry "_long".
      const M = (name) => isLong ? name + '_long' : name;
      const summary = { correct: 0 };
      const w = savedState.winner;
      document.documentElement.style.setProperty('--winner-color', w.hex);

      // LOADING
      goSlide(s => {
        s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Sender valg til modellen…</p></div>';
      });

      let surveyId = null, features = null;
      try {
        const resp = await postJson('/survey', {
          payload: buildPayload(savedState),
          metadata: buildMetadata(savedState),
        });
        surveyId = resp.id;
        features = resp.features;
      } catch (err) {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><p class="rv-error">Kunne ikke nå inferensserveren.<br>Prøv igjen om litt.</p></div>';
        });
        return;
      }

      // Update URL with the survey ID for shareability
      try {
        const newUrl = window.location.pathname + '?id=' + encodeURIComponent(surveyId);
        history.replaceState(null, '', newUrl);
      } catch (_e) {}

      // GENDER
      let predGenderLabel = null, confirmedGender = null;
      try {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Laster kjønnsmodellen…</p></div>';
        });
        const model = await loadModel(M('gender'));
        const raw = TreeWalker.score(model, features.gender);
        const prob = TreeWalker.sigmoid(raw);
        predGenderLabel = prob >= 0.5 ? 'kvinne' : 'mann';
        const other = predGenderLabel === 'kvinne' ? 'mann' : 'kvinne';
        const pct = Math.round(Math.max(prob, 1 - prob) * 100);

        confirmedGender = await new Promise(resolve => {
          goSlide(s => {
            s.innerHTML =
              makeDots('kjønn') +
              '<p class="rv-eyebrow">Vi tror du er en</p>' +
              '<p class="rv-big">' + predGenderLabel + '</p>' +
              '<p class="rv-conf">' + pct + '% sikker</p>' +
              '<div class="rv-btns">' +
                '<button type="button" class="rv-btn is-yes" id="rvGY">Stemmer!</button>' +
                '<button type="button" class="rv-btn is-no" id="rvGN">Jeg er faktisk en ' + other + '</button>' +
                '<button type="button" class="rv-btn is-no" id="rvGNB">Jeg er faktisk ikke-binær</button>' +
              '</div>';
            s.querySelector('#rvGY').addEventListener('click', () => resolve(predGenderLabel));
            s.querySelector('#rvGN').addEventListener('click', () => resolve(other));
            s.querySelector('#rvGNB').addEventListener('click', () => resolve('ikke-binær'));
          });
        });

        if (confirmedGender === predGenderLabel) summary.correct += 1;
        // The API stores canonical English labels ('man' | 'woman' | 'non-binary');
        // map the Norwegian display value before posting.
        const genderApiLabel = { 'mann': 'man', 'kvinne': 'woman', 'ikke-binær': 'non-binary' }[confirmedGender] || confirmedGender;
        postJson('/survey/' + encodeURIComponent(surveyId) + '/gender', {
          pred_prob: prob, confirmed_label: genderApiLabel,
        }).catch(e => console.warn('gender post failed', e));
      } catch (err) {
        console.warn('gender step failed', err);
      }

      // AGE
      let predAge = null, confirmedAge = null;
      try {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Laster aldersmodellen…</p></div>';
        });
        const model = await loadModel(M('age'));
        predAge = Math.max(6, Math.min(80, TreeWalker.score(model, features.age)));
        const rounded = Math.round(predAge);

        confirmedAge = await new Promise(resolve => {
          goSlide(s => {
            s.innerHTML =
              makeDots('alder') +
              '<p class="rv-eyebrow">Vi tror du er omtrent</p>' +
              '<p class="rv-big">' + rounded + '</p>' +
              '<p class="rv-conf">år gammel — skriv inn din faktiske alder nedenfor</p>' +
              '<div class="rv-age-wrap">' +
                '<input type="number" id="rvAgeInp" value="0">' +
                '<span class="rv-hint">skriv inn din ekte alder</span>' +
              '</div>' +
              '<div class="rv-btns">' +
                '<button type="button" class="rv-btn is-yes" id="rvAgeSave">Bekreft alder</button>' +
              '</div>';
            const inp = s.querySelector('#rvAgeInp');
            inp.focus();
            inp.select();
            // Send the literal value, no clamp: a left-at-0 (or blank) commit saves
            // 0 so pure click-throughs are filterable, and junk like -20 saves as-is.
            const save = () => resolve(parseInt(inp.value, 10) || 0);
            s.querySelector('#rvAgeSave').addEventListener('click', save);
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
          });
        });

        if (Math.abs(confirmedAge - predAge) <= 3) summary.correct += 1;
        postJson('/survey/' + encodeURIComponent(surveyId) + '/age', {
          pred_value: predAge, confirmed_value: confirmedAge,
        }).catch(e => console.warn('age post failed', e));
      } catch (err) {
        console.warn('age step failed', err);
      }

      // MOOD
      let predMood = null, confirmedMood = null;
      try {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Laster humørmodellen…</p></div>';
        });
        const model = await loadModel(M('mood'));
        predMood = Math.max(0, Math.min(60, TreeWalker.score(model, features.mood)));
        const rounded = Math.round(predMood);

        confirmedMood = await new Promise(resolve => {
          goSlide(s => {
            s.innerHTML =
              makeDots('humør') +
              '<p class="rv-eyebrow">Hvordan har du det akkurat nå?</p>' +
              '<p class="rv-big" id="rvMoodWord">' + moodLabel(rounded) + '</p>' +
              '<div class="rv-slider-wrap">' +
                '<input type="range" id="rvMoodSlider" min="0" max="60" step="1" value="' + rounded + '">' +
                '<div class="rv-slider-labels"><span>Trist</span><span>Litt nede</span><span>Ok</span><span>Glad</span></div>' +
              '</div>' +
              '<div class="rv-btns">' +
                '<button type="button" class="rv-btn is-yes" id="rvMoodSave">Bekreft humør</button>' +
              '</div>';
            const slider = s.querySelector('#rvMoodSlider');
            const wordEl = s.querySelector('#rvMoodWord');
            slider.addEventListener('input', () => { wordEl.textContent = moodLabel(parseInt(slider.value, 10)); });
            s.querySelector('#rvMoodSave').addEventListener('click', () => resolve(parseInt(slider.value, 10)));
          });
        });

        if (Math.abs(confirmedMood - predMood) <= 10) summary.correct += 1;
        postJson('/survey/' + encodeURIComponent(surveyId) + '/mood', {
          pred_value: predMood, confirmed_value: confirmedMood,
        }).catch(e => console.warn('mood post failed', e));
      } catch (err) {
        console.warn('mood step failed', err);
      }

      // STATS
      showStatsSlide({
        w,
        confirmedGender,
        confirmedAge,
        confirmedMood,
        score: summary.correct,
        history: savedState.history,
        picks: savedState.picks,
        fromId: false,
        long: isLong,
        features,
      });
    }

    // ---- Entry point ----
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (id) {
        runIdFlow(id);
        return;
      }

      let savedState = null;
      try {
        const raw = localStorage.getItem('cpgResult');
        if (raw) {
          savedState = JSON.parse(raw);
          localStorage.removeItem('cpgResult');
        }
      } catch (_e) {}

      if (!savedState || !savedState.winner) {
        const s = document.createElement('div');
        s.className = 'rv-slide';
        wrap.appendChild(s);
        s.innerHTML = '<div class="rv-center"><p class="rv-error">Ingen surveydata funnet.<br><a href="survey">Ta surveyet</a></p></div>';
        requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('is-current')));
        return;
      }

      runRevealFlow(savedState);
    })();
  })();
  </script>
</body>
