<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your results · Color Polygraph · Andreas Lindeman</title>
  <meta name="description" content="Color Polygraph results: see what the AI guessed about your gender, age, and mood from 21 colour picks." />
  <link rel="alternate" hreflang="en" href="https://ai.andreaslindeman.com/color-polygraph/survey-result" />
  <link rel="alternate" hreflang="no" href="https://ai.andreaslindeman.no/color-polygraph/survey-result" />
  <link rel="alternate" hreflang="x-default" href="https://ai.andreaslindeman.com/color-polygraph/survey-result" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    /* Full-bleed fullscreen immediately */
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    body .site-nav { flex-shrink: 0; }
    .rv-wrap {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* ---- Reveal slides ---- */
    .rv-slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px, 6vh, 72px) clamp(28px, 6vw, 96px);
      opacity: 0;
      transform: translateX(56px);
      transition: opacity 0.4s ease, transform 0.42s cubic-bezier(.22,.68,0,1.1);
      pointer-events: none;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .rv-slide.is-current {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .rv-slide.is-leaving {
      opacity: 0;
      transform: translateX(-56px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
    }
    /* ambient winner-color glow */
    .rv-slide::after {
      content: '';
      position: fixed;
      top: -100px; right: 0;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: var(--winner-color, transparent);
      opacity: 0.055;
      filter: blur(120px);
      pointer-events: none;
      z-index: -1;
    }

    /* step dots */
    .rv-dots {
      display: flex;
      gap: 10px;
      margin-bottom: 48px;
      align-items: center;
    }
    .rv-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--hairline-2);
      flex-shrink: 0;
      transition: background .35s ease, transform .35s ease;
    }
    .rv-dot.is-done { background: var(--text-dim); }
    .rv-dot.is-active { background: var(--hobby); transform: scale(1.35); }
    .rv-dot-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-left: 6px;
    }

    /* center (loading) */
    .rv-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      gap: 22px;
      text-align: center;
    }
    .rv-spinner {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2.5px solid var(--hairline-2);
      border-top-color: var(--hobby);
      animation: rv-spin 0.75s linear infinite;
    }
    @keyframes rv-spin { to { transform: rotate(360deg); } }
    .rv-loading-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0;
    }
    .rv-error {
      font-family: var(--mono);
      font-size: 11px;
      color: #d97b6a;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.7;
    }
    .rv-error a {
      color: var(--hobby);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* prediction display */
    .rv-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 14px;
    }
    .rv-big {
      font-family: var(--serif);
      font-style: italic;
      font-variation-settings: "opsz" 72, "SOFT" 60;
      font-size: clamp(52px, 11vw, 104px);
      line-height: 1;
      color: var(--hobby);
      margin: 0 0 12px;
    }
    .rv-conf {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0 0 36px;
    }
    .rv-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 2;
    }
    .rv-btn {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 11px 18px;
      border-radius: 2px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s, color .15s, background .15s;
    }
    .rv-btn.is-yes {
      background: rgba(245, 185, 92, 0.12);
      color: var(--hobby);
      border: 1px solid rgba(245, 185, 92, 0.4);
    }
    .rv-btn.is-yes:hover {
      background: rgba(245, 185, 92, 0.18);
      border-color: rgba(245, 185, 92, 0.6);
      transform: translateY(-1px);
    }
    .rv-btn.is-no {
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
    }
    .rv-btn.is-no:hover { color: var(--text); border-color: var(--hairline-2); }

    /* censored overlay — gender slide */
    .rv-censor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 36%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .rv-censor::before {
      content: '';
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px) saturate(0.2) brightness(0.6);
      -webkit-backdrop-filter: blur(20px) saturate(0.2) brightness(0.6);
      background: linear-gradient(to bottom, rgba(10,13,24,0.05) 0%, rgba(10,13,24,0.85) 100%);
    }
    .rv-censor-bar {
      position: absolute;
      left: 0; right: 0;
      top: 28%;
      height: 24px;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .rv-censor-bar span {
      font-family: var(--mono);
      font-size: 7px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.13);
    }

    /* age input */
    .rv-age-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .rv-age-wrap input[type="number"] {
      font-family: var(--mono);
      font-size: 32px;
      width: 96px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--hairline-2);
      border-radius: 3px;
      color: var(--hobby);
      text-align: center;
      appearance: textfield;
      -moz-appearance: textfield;
      -webkit-appearance: textfield;
      letter-spacing: 0.04em;
    }
    .rv-age-wrap input[type="number"]::-webkit-outer-spin-button,
    .rv-age-wrap input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; }
    .rv-age-wrap input[type="number"]:focus {
      outline: none;
      border-color: rgba(245, 185, 92, 0.5);
    }
    .rv-hint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    /* mood slider */
    .rv-slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
      max-width: 380px;
    }
    .rv-slider-wrap input[type="range"] {
      width: 100%;
      accent-color: var(--hobby);
      cursor: pointer;
    }
    .rv-slider-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* stats slide */
    .rv-stats-layout {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 28px;
      align-items: start;
      margin-bottom: 24px;
    }
    .rv-winner-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid var(--hairline);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .rv-winner-hex {
      font-family: var(--mono);
      font-size: 26px;
      letter-spacing: 0.05em;
      color: var(--hobby);
      margin: 0 0 4px;
    }
    .rv-winner-rgb {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-mute);
      margin: 0 0 18px;
    }
    .rv-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }
    .rv-pill {
      padding: 4px 11px;
      border: 1px solid var(--hairline-2);
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      color: var(--text-mute);
      background: var(--surface);
    }
    .rv-pill b { color: var(--hobby); font-weight: 500; }
    .rv-hue-strip {
      display: flex;
      height: 6px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
      border: 1px solid var(--hairline);
    }
    .rv-hue-strip-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      margin: 0 0 24px;
    }

    /* colour-taste fingerprint line */
    .rv-fingerprint {
      font-family: var(--serif);
      font-size: clamp(17px, 2.6vw, 23px);
      line-height: 1.45;
      color: var(--text);
      margin: 4px 0 26px;
      max-width: 640px;
    }
    .rv-fingerprint b {
      font-style: italic;
      font-weight: 500;
      color: var(--hobby);
    }

    /* drawn-to / passed-over mosaics */
    .rv-taste {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      margin-bottom: 28px;
    }
    .rv-taste-col { min-width: 0; }
    .rv-taste-label {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0 0 10px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .rv-taste-label span {
      color: var(--text-dim);
      letter-spacing: 0.12em;
      font-size: 8.5px;
    }
    .rv-mosaic {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-content: flex-start;
    }
    .rv-chip {
      border-radius: 2px;
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
      cursor: default;
    }
    .rv-mosaic.is-liked .rv-chip { width: 20px; height: 20px; }
    .rv-mosaic.is-rejected .rv-chip { width: 12px; height: 12px; opacity: 0.5; }
    .rv-chip:hover {
      transform: scale(1.45);
      opacity: 1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      position: relative;
      z-index: 3;
    }
    .rv-chip.is-fav {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--hobby);
      opacity: 1;
    }

    .rv-score {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--text-mute);
      margin: 0 0 20px;
    }
    .rv-score b { color: var(--hobby); }
    .rv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .rv-retake {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 13px 28px;
      background: var(--hobby);
      color: var(--bg);
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 500;
      transition: transform .15s ease, filter .15s ease;
      box-shadow: 0 6px 20px rgba(245, 185, 92, 0.2);
    }
    .rv-retake:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .rv-share {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 13px 20px;
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .rv-share:hover { color: var(--text); border-color: var(--hairline-2); }
    .rv-share-toast {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--hobby);
    }

    /* color fingerprint */
    .rv-fingerprint {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: 0 0 14px;
    }
    .rv-fingerprint b {
      color: var(--hobby);
      font-weight: 500;
    }

    /* taste contrast (drawn to / passed over) */
    .rv-taste {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      margin: 6px 0 26px;
    }
    .rv-taste-head {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 10px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .rv-taste-count {
      color: var(--text-mute);
      font-size: 8.5px;
      letter-spacing: 0.1em;
    }
    .rv-taste-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .rv-taste-grid i {
      display: block;
      width: 15px;
      height: 15px;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .rv-taste-grid i.is-fav {
      outline: 1.5px solid var(--hobby);
      outline-offset: 1.5px;
    }
    .rv-taste-grid.is-rejected {
      opacity: 0.5;
    }
    .rv-taste-grid.is-rejected i {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      filter: saturate(0.7);
    }

    /* The stats slide grew tall (cube + taste grids): top-align it so the
       content above the fold stays scrollable. justify-content:center on an
       overflowing flex column clips the top above the scroll origin. */
    .rv-slide.rv-stats-slide { justify-content: flex-start; }

    /* ---- personal colour cube (embedded in the stats slide) ---- */
    .rv-cube-embed {
      max-width: 520px;
      margin: 4px 0 28px;
    }
    .rv-cube-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-height: 440px;
    }
    .rv-cube-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    .rv-cube-canvas-wrap canvas:active { cursor: grabbing; }
    .rv-cube-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0 0;
    }
    .rv-cube-progress-track {
      flex: 1 1 auto;
      height: 4px;
      border-radius: 2px;
      background: var(--hairline-2);
      overflow: hidden;
    }
    .rv-cube-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--hobby);
      border-radius: 2px;
      transition: width 0.18s ease;
    }
    .rv-cube-progress-label {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .rv-cube-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
    }
    .rv-cube-toggle { display: flex; gap: 8px; }
    .rv-cube-toggle .rv-btn[aria-pressed="false"] {
      background: transparent;
      color: var(--text-mute);
      border: 1px solid var(--hairline);
    }

    @media (max-width: 600px) {
      .rv-stats-layout { grid-template-columns: 1fr; }
      .rv-winner-swatch { max-width: 130px; }
      .rv-big { font-size: clamp(44px, 18vw, 80px); }
      .rv-slide { padding: 20px 20px; }
      .rv-dots { margin-bottom: 32px; }
      .rv-taste { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav" aria-label="Primary">
    <a href="https://andreaslindeman.com/" class="brand">
      <span class="brand-mark">AL</span>
      <span class="brand-name">Andreas Lindeman</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links-list" aria-label="Open menu">
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
    <ul id="nav-links-list" class="nav-links">
      <li><a href="https://andreaslindeman.com/#about">About</a></li>
      <li><a href="https://andreaslindeman.com/#timeline">Timeline</a></li>

      <li><a href="https://andreaslindeman.com/#contact">Contact</a></li>
    </ul>
    <a class="lang-switch" data-lang-base="https://ai.andreaslindeman.no" href="https://ai.andreaslindeman.no/" hreflang="no" aria-label="Switch to Norwegian">
      <svg class="lang-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
      <span class="lang-pair"><span class="lang-current">EN</span><span class="lang-sep" aria-hidden="true">/</span><span class="lang-target">NO</span></span>
    </a>
  </nav>
  <script>
    (function(){
      var s=document.querySelector('.lang-switch');
      if(s&&s.dataset.langBase)s.href=s.dataset.langBase+location.pathname+location.search+location.hash;
      var nav=document.querySelector('.site-nav'),btn=document.querySelector('.nav-toggle');
      if(btn&&nav){
        function closeMenu(){nav.classList.remove('is-open');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Open menu');}
        btn.addEventListener('click',function(e){e.stopPropagation();var open=nav.classList.toggle('is-open');btn.setAttribute('aria-expanded',open?'true':'false');btn.setAttribute('aria-label',open?'Close menu':'Open menu');});
        nav.querySelectorAll('.nav-links a').forEach(function(a){a.addEventListener('click',closeMenu);});
        document.addEventListener('click',function(e){if(nav.classList.contains('is-open')&&!nav.contains(e.target))closeMenu();});
        document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nav.classList.contains('is-open'))closeMenu();});
      }
    })();
  </script>

  <div class="rv-wrap" id="rvWrap"></div>

  <!-- ?v= cache-busts: bump when a models-js file changes, or the browser
       keeps serving the old script (stale cube logic / wrong feature count). -->
  <script src="./models-js/tree_walker.js?v=2"></script>
  <script src="./models-js/taste_features.js?v=2"></script>
  <script src="./models-js/pick_features.js?v=2"></script>
  <script src="./models-js/pick_cube.js?v=2"></script>
  <script>
  (function () {
    const DEFAULT_API_URL = 'https://api.andreaslindeman.com/color-polygraph';
    const API_URL = (function () {
      try {
        const p = new URLSearchParams(window.location.search);
        if (p.get('api')) return p.get('api').replace(/\/$/, '');
      } catch (_e) {}
      return (typeof window !== 'undefined' && window.COLOR_POLYGRAPH_API)
        ? window.COLOR_POLYGRAPH_API.replace(/\/$/, '')
        : DEFAULT_API_URL;
    })();
    const MODELS_BASE = './models-js/';
    const MODEL_CACHE = Object.create(null);

    // How many fresh survey questions the pick model answers for the colour
    // cube. Defined once in pick_cube.js (TOTAL_ANSWERS); override per-visit
    // with ?answers=NNNN. Display weights too: ?w1=&w2=&wf=&wrej=.
    const CUBE_ANSWERS = (function () {
      try {
        const v = parseInt(new URLSearchParams(window.location.search).get('answers'), 10);
        if (v > 0) return v;
      } catch (_e) {}
      return PickCube.TOTAL_ANSWERS;
    })();

    function loadModel(name) {
      if (MODEL_CACHE[name]) return MODEL_CACHE[name];
      const url = MODELS_BASE + name + '_trees.json';
      MODEL_CACHE[name] = TreeWalker.load(url).catch(err => { delete MODEL_CACHE[name]; throw err; });
      return MODEL_CACHE[name];
    }

    async function postJson(path, body) {
      const r = await fetch(API_URL + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.json()).error || ''; } catch (_e) {}
        throw new Error('HTTP ' + r.status + (detail ? ' - ' + detail : ''));
      }
      return r.json();
    }

    async function getJson(path) {
      const r = await fetch(API_URL + path);
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.json()).error || ''; } catch (_e) {}
        throw new Error('HTTP ' + r.status + (detail ? ' - ' + detail : ''));
      }
      return r.json();
    }

    // ---- Slide engine ----
    const wrap = document.getElementById('rvWrap');
    let _current = null;
    let _cubeController = null;  // running cube render loop, if any

    function goSlide(buildFn) {
      if (_current) {
        const old = _current;
        old.classList.remove('is-current');
        old.classList.add('is-leaving');
        setTimeout(() => { if (old.parentNode) old.remove(); }, 400);
        _current = null;
      }
      const s = document.createElement('div');
      s.className = 'rv-slide';
      wrap.appendChild(s);
      buildFn(s);
      requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('is-current')));
      _current = s;
      return s;
    }

    function makeDots(activeKey) {
      const steps = ['gender', 'age', 'mood', 'stats'];
      const ai = steps.indexOf(activeKey);
      return '<div class="rv-dots">' +
        steps.map((s, i) => '<span class="rv-dot' + (i < ai ? ' is-done' : i === ai ? ' is-active' : '') + '"></span>').join('') +
        '<span class="rv-dot-label">' + activeKey + '</span>' +
        '</div>';
    }

    function moodLabel(v) {
      if (v >= 45) return 'happy';
      if (v >= 30) return 'okay';
      if (v >= 15) return 'down';
      return 'glum';
    }

    function rgbToHsl([r, g, b]) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      if (max === min) return [0, 0, Math.round(l * 100)];
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      let h;
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        default: h = ((r - g) / d + 4) / 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    function buildHueStrip(history) {
      const allPicks = [];
      history.forEach(round => round.forEach(p => allPicks.push(p.winner)));
      const sorted = allPicks.slice().sort((a, b) => rgbToHsl(a.rgb)[0] - rgbToHsl(b.rgb)[0]);
      const chips = sorted.map(c => '<div style="flex:1;min-width:2px;background:' + c.hex + '"></div>').join('');
      return '<div class="rv-hue-strip">' + chips + '</div><p class="rv-hue-strip-label">All your picks sorted by hue</p>';
    }

    function paletteTone(history) {
      const picks = [];
      history.forEach(round => round.forEach(p => picks.push(p.winner.rgb)));
      if (!picks.length) return 'mixed';
      const avg = picks.reduce((s, rgb) => s + rgbToHsl(rgb)[0], 0) / picks.length;
      return avg < 50 || avg > 310 ? 'warm' : avg > 140 && avg < 270 ? 'cool' : 'mixed';
    }

    // Split every colour the survey ever showed into the ones the user kept
    // choosing (winners) and the ones they passed over (shown but never picked).
    // A colour's "weight" grows the further it advanced, so the overall winner
    // counts the most. Works for both lengths: history shape is identical.
    function collectTaste(history) {
      const winnerHex = new Set();
      const likedMap = new Map();   // hex -> { color, weight }
      history.forEach((round, ri) => {
        round.forEach(q => {
          if (!q || !q.winner) return;
          winnerHex.add(q.winner.hex);
          const e = likedMap.get(q.winner.hex);
          if (e) e.weight += ri + 1;
          else likedMap.set(q.winner.hex, { color: q.winner, weight: ri + 1 });
        });
      });
      const rejectedMap = new Map();
      history.forEach(round => {
        round.forEach(q => {
          (q && q.options || []).forEach(o => {
            if (!winnerHex.has(o.hex) && !rejectedMap.has(o.hex)) rejectedMap.set(o.hex, o);
          });
        });
      });
      const byHue = (a, b) => rgbToHsl((a.color || a).rgb)[0] - rgbToHsl((b.color || b).rgb)[0];
      return {
        liked: [...likedMap.values()].sort(byHue),
        rejected: [...rejectedMap.values()].sort(byHue),
      };
    }

    // A weighted read of the colours the user was drawn to, on three axes:
    // temperature, saturation, lightness. Returns key strings; the caller maps
    // them to display words so the same logic serves both languages.
    function colorFingerprint(taste) {
      const liked = taste.liked;
      if (!liked.length) return null;
      let wsum = 0, Lsum = 0, Ssum = 0, warm = 0, cool = 0;
      liked.forEach(({ color, weight }) => {
        const [h, s, l] = rgbToHsl(color.rgb);
        wsum += weight; Lsum += l * weight; Ssum += s * weight;
        if (h < 60 || h >= 300) warm += weight;
        else if (h >= 150 && h < 270) cool += weight;
      });
      const L = Lsum / wsum, S = Ssum / wsum;
      return {
        temp: warm > cool * 1.2 ? 'warm' : cool > warm * 1.2 ? 'cool' : 'balanced',
        sat: S >= 58 ? 'vivid' : S <= 28 ? 'muted' : 'soft',
        light: L >= 62 ? 'bright' : L <= 38 ? 'dark' : 'medium',
      };
    }

    function buildTasteSection(history, favHex) {
      const t = collectTaste(history);
      if (!t.liked.length && !t.rejected.length) return '';
      const fav = (favHex || '').toLowerCase();
      const likedCells = t.liked.map(({ color }) =>
        '<i class="' + (color.hex.toLowerCase() === fav ? 'is-fav' : '') + '" style="background:' + color.hex + '"></i>'
      ).join('');
      const rejCells = t.rejected.map(c => '<i style="background:' + c.hex + '"></i>').join('');
      return '<div class="rv-taste">' +
        '<div class="rv-taste-col">' +
          '<p class="rv-taste-head">Drawn to <span class="rv-taste-count">' + t.liked.length + '</span></p>' +
          '<div class="rv-taste-grid">' + likedCells + '</div>' +
        '</div>' +
        '<div class="rv-taste-col">' +
          '<p class="rv-taste-head">Passed over <span class="rv-taste-count">' + t.rejected.length + '</span></p>' +
          '<div class="rv-taste-grid is-rejected">' + rejCells + '</div>' +
        '</div>' +
      '</div>';
    }

    function fingerprintPhrase(history) {
      const fp = colorFingerprint(collectTaste(history));
      if (!fp) return null;
      const sat = fp.sat, light = fp.light;
      return fp.temp.charAt(0).toUpperCase() + fp.temp.slice(1) + ', ' + sat + ', ' + light;
    }

    function buildPayload(savedState) {
      // Bracket columns are consistent across both variants: offered = every
      // colour shown in round 0, r1/r2(/r3) = the winners after each round, and
      // final = the single winner of the last round.
      //   short (3 rounds): offered(64) -> r1(16) -> r2(4) -> final
      //   long  (4 rounds): offered(256) -> r1(64) -> r2(16) -> r3(4) -> final
      const history = savedState.history;
      const offered = [];
      history[0].forEach(step => step.options.forEach(c => offered.push(c.rgb)));
      const finalRound = history[history.length - 1];
      const payload = {
        offered,
        r1: history[0].map(s => s.winner.rgb),
        r2: history[1].map(s => s.winner.rgb),
        final: finalRound[0].winner.rgb,
        valg: savedState.picks.map(p => String(p.position)).join(''),
        tider: savedState.picks.map(p => p.cumulativeMs),
      };
      if (savedState.long) {
        payload.r3 = history[2].map(s => s.winner.rgb);
        payload.long = true;
      }
      return payload;
    }

    function buildMetadata(savedState) {
      const ua = navigator.userAgent || '';
      const isMobile = /Mobi|Android|iPhone|iPad|iPod|IEMobile|Opera Mini/.test(ua)
        || (navigator.maxTouchPoints > 0 && window.matchMedia('(pointer: coarse)').matches);
      let timezone = '';
      try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (_e) {}
      return {
        client_started_at: savedState.startMs,
        client_submitted_at: Date.now(),
        client_local_time: new Date().toISOString(),
        user_agent: ua,
        referrer: document.referrer || '',
        language: navigator.language || '',
        locale: (navigator.languages || []).join(','),
        is_mobile: isMobile,
        screen_w: window.screen ? window.screen.width : null,
        screen_h: window.screen ? window.screen.height : null,
        viewport_w: window.innerWidth,
        viewport_h: window.innerHeight,
        timezone_client: timezone,
      };
    }

    function showStatsSlide(opts) {
      const { w, confirmedGender, confirmedAge, confirmedMood, score, history, picks, fromId, long, features } = opts;
      // The colour-pick model is short-survey only, and needs the prod feature
      // vectors (fresh from POST /survey, or regenerated by GET /survey/:id).
      const canCube = !!history && !long && !!(features && features.gender);
      const pickCount = picks && picks.length ? picks.length : null;
      const totalMs = picks && picks.length ? picks[picks.length - 1].cumulativeMs : 0;
      const totalS = Math.round(totalMs / 1000);
      const timeStr = totalS >= 60 ? Math.floor(totalS / 60) + 'm ' + (totalS % 60) + 's' : totalS > 0 ? totalS + 's' : '—';
      const shareUrl = window.location.origin + window.location.pathname + window.location.search;
      const phrase = history ? fingerprintPhrase(history) : null;

      const pillsHtml = [
        confirmedGender ? '<span class="rv-pill">Gender <b>' + confirmedGender + '</b></span>' : '',
        confirmedAge != null ? '<span class="rv-pill">Age <b>' + confirmedAge + '</b></span>' : '',
        confirmedMood != null ? '<span class="rv-pill">Mood <b>' + moodLabel(confirmedMood) + '</b></span>' : '',
        timeStr !== '—' ? '<span class="rv-pill">Time <b>' + timeStr + '</b></span>' : '',
      ].join('');

      goSlide(s => {
        s.classList.add('rv-stats-slide');
        s.innerHTML =
          makeDots('stats') +
          '<div class="rv-stats-layout">' +
            '<div class="rv-winner-swatch" style="background:' + w.hex + '"></div>' +
            '<div>' +
              '<p class="rv-eyebrow">Your favourite color</p>' +
              '<p class="rv-winner-hex">' + w.hex.toUpperCase() + '</p>' +
              '<p class="rv-winner-rgb">rgb(' + w.rgb[0] + ', ' + w.rgb[1] + ', ' + w.rgb[2] + ')</p>' +
              (phrase ? '<p class="rv-fingerprint">Your palette reads <b>' + phrase + '</b></p>' : '') +
              '<div class="rv-pills">' + pillsHtml + '</div>' +
              (history ? buildHueStrip(history) : '') +
            '</div>' +
          '</div>' +
          (canCube ?
            '<div class="rv-cube-embed">' +
              '<div class="rv-cube-canvas-wrap"><canvas id="rvCubeCanvas"></canvas></div>' +
              '<div class="rv-cube-progress" id="rvCubeProgress">' +
                '<div class="rv-cube-progress-track"><div class="rv-cube-progress-fill" id="rvCubeFill"></div></div>' +
                '<span class="rv-cube-progress-label" id="rvCubeLabel">loading model…</span>' +
              '</div>' +
              '<div class="rv-cube-controls">' +
                '<div class="rv-cube-toggle">' +
                  '<button type="button" class="rv-btn is-yes" id="rvCubeLiked" aria-pressed="true">Drawn to</button>' +
                  '<button type="button" class="rv-btn is-no" id="rvCubeRej" aria-pressed="false">Passed over</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          : '') +
          (history ? buildTasteSection(history, w.hex) : '') +
          (score != null ? '<p class="rv-score">The model got <b>' + score + ' of 3</b> correct.</p>' : '') +
          '<div class="rv-actions">' +
            '<button type="button" class="rv-retake" id="rvRetake">Retake survey</button>' +
            '<button type="button" class="rv-share" id="rvShare">Share results</button>' +
            '<span class="rv-share-toast" id="rvToast" style="display:none">Link copied</span>' +
          '</div>' +
          (long ? '' :
            '<p style="font-family:var(--mono);font-size:11px;letter-spacing:0.03em;color:var(--text-mute);margin:20px 0 0;line-height:1.6">' +
            'Want a sharper read? <a href="survey?type=long" style="color:var(--hobby);text-decoration:underline;text-underline-offset:3px">Take the long test</a> — it’s highly accurate.</p>') +
          '<a href="https://andreaslindeman.com/projects/color-polygraph" class="project-back" style="display:inline-block;margin-top:18px">More about the project</a>';

        s.querySelector('#rvRetake').addEventListener('click', () => {
          window.location.href = long ? 'survey?type=long' : 'survey?type=short';
        });

        // Colour cube: the pick model retakes the survey live, filling the
        // cube as it answers; the bar below it tracks progress.
        if (canCube) {
          const progress = s.querySelector('#rvCubeProgress');
          const fill = s.querySelector('#rvCubeFill');
          const label = s.querySelector('#rvCubeLabel');
          const liked = s.querySelector('#rvCubeLiked');
          const rej = s.querySelector('#rvCubeRej');

          if (_cubeController) { _cubeController.stop(); _cubeController = null; }
          PickCube.mount(s.querySelector('#rvCubeCanvas'), {
            history,
            features,
            modelUrl: MODELS_BASE + 'pick_trees.json?v=2',  // bump on retrain (force-cached)
            totalAnswers: CUBE_ANSWERS,
            onProgress: (answered, total) => {
              fill.style.width = (answered / total * 100).toFixed(1) + '%';
              label.textContent = answered.toLocaleString() + ' / ' + total.toLocaleString();
            },
            onDone: () => { progress.style.display = 'none'; },
          }).then(controller => {
            _cubeController = controller;
          }).catch(err => {
            console.warn('cube build failed', err);
            label.textContent = 'cube unavailable';
          });

          const setMode = (inv) => {
            if (_cubeController) _cubeController.setInverted(inv);
            liked.setAttribute('aria-pressed', String(!inv));
            rej.setAttribute('aria-pressed', String(inv));
            liked.className = 'rv-btn ' + (inv ? 'is-no' : 'is-yes');
            rej.className = 'rv-btn ' + (inv ? 'is-yes' : 'is-no');
          };
          liked.addEventListener('click', () => setMode(false));
          rej.addEventListener('click', () => setMode(true));
        }
        s.querySelector('#rvShare').addEventListener('click', () => {
          const picksStr = pickCount ? pickCount + ' colour picks' : 'colour picks alone';
          const tasteStr = phrase ? 'My colour taste is ' + phrase.toLowerCase() + ', built around ' + w.hex.toUpperCase() + '.'
                                  : 'My favourite color is ' + w.hex.toUpperCase() + '.';
          const guessStr = ' The Color Polygraph AI read my gender, age & mood from ' + picksStr +
                           (score != null ? ' and got ' + score + '/3' : '') + '. What does yours say?';
          const shareData = {
            title: 'Color Polygraph',
            text: tasteStr + guessStr,
            url: shareUrl,
          };
          const toast = s.querySelector('#rvToast');
          if (navigator.share) {
            navigator.share(shareData).catch(() => {});
            return;
          }
          const text = shareData.text + ' ' + shareData.url;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
              toast.style.display = '';
              setTimeout(() => { toast.style.display = 'none'; }, 2400);
            }).catch(() => window.prompt('Copy link:', text));
          } else {
            window.prompt('Copy link:', text);
          }
        });
      });
    }

    // ---- ID-based flow (shared link) ----
    async function runIdFlow(id) {
      goSlide(s => {
        s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Loading results…</p></div>';
      });

      let data;
      try {
        data = await getJson('/survey/' + encodeURIComponent(id));
      } catch (err) {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><p class="rv-error">Could not load results for this ID.<br><a href="survey">Take the survey</a></p></div>';
        });
        return;
      }

      const w = { hex: data.winner_hex, rgb: data.winner_rgb };
      document.documentElement.style.setProperty('--winner-color', w.hex);

      showStatsSlide({
        w,
        confirmedGender: data.confirmed_gender,
        confirmedAge: data.confirmed_age,
        confirmedMood: data.confirmed_mood,
        score: data.correct_count,
        history: data.history || null,
        picks: data.picks || null,
        fromId: true,
        long: !!data.long_survey,
        features: data.features || null,
      });
    }

    // ---- Full interactive reveal flow ----
    async function runRevealFlow(savedState) {
      const isLong = !!savedState.long;
      const summary = { correct: 0 };
      const w = savedState.winner;
      document.documentElement.style.setProperty('--winner-color', w.hex);

      // LOADING
      goSlide(s => {
        s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Sending picks to model…</p></div>';
      });

      let surveyId = null, features = null;
      try {
        const resp = await postJson('/survey', {
          payload: buildPayload(savedState),
          metadata: buildMetadata(savedState),
        });
        surveyId = resp.id;
        features = resp.features;
      } catch (err) {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><p class="rv-error">Could not reach the inference server.<br>Try again in a moment.</p></div>';
        });
        return;
      }

      // Update URL with the survey ID for shareability
      try {
        const newUrl = window.location.pathname + '?id=' + encodeURIComponent(surveyId);
        history.replaceState(null, '', newUrl);
      } catch (_e) {}

      // The long survey has its own trained heads; everything below is identical
      // to the short flow except the model name carries a "_long" suffix.
      const M = (name) => isLong ? name + '_long' : name;

      // GENDER
      let predGenderLabel = null, confirmedGender = null;
      try {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Loading gender model…</p></div>';
        });
        const model = await loadModel(M('gender'));
        const raw = TreeWalker.score(model, features.gender);
        const prob = TreeWalker.sigmoid(raw);
        predGenderLabel = prob >= 0.5 ? 'woman' : 'man';
        const other = predGenderLabel === 'woman' ? 'man' : 'woman';
        const pct = Math.round(Math.max(prob, 1 - prob) * 100);

        confirmedGender = await new Promise(resolve => {
          goSlide(s => {
            s.innerHTML =
              makeDots('gender') +
              '<p class="rv-eyebrow">We think you are a</p>' +
              '<p class="rv-big">' + predGenderLabel + '</p>' +
              '<p class="rv-conf">' + pct + '% confident</p>' +
              '<div class="rv-btns">' +
                '<button type="button" class="rv-btn is-yes" id="rvGY">That’s right</button>' +
                '<button type="button" class="rv-btn is-no" id="rvGN">Actually I’m a ' + other + '</button>' +
              '</div>';
            s.querySelector('#rvGY').addEventListener('click', () => resolve(predGenderLabel));
            s.querySelector('#rvGN').addEventListener('click', () => resolve(other));
          });
        });

        if (confirmedGender === predGenderLabel) summary.correct += 1;
        postJson('/survey/' + encodeURIComponent(surveyId) + '/gender', {
          pred_prob: prob, confirmed_label: confirmedGender,
        }).catch(e => console.warn('gender post failed', e));
      } catch (err) {
        console.warn('gender step failed', err);
      }

      // AGE
      let predAge = null, confirmedAge = null;
      try {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Loading age model…</p></div>';
        });
        const model = await loadModel(M('age'));
        predAge = Math.max(6, Math.min(80, TreeWalker.score(model, features.age)));
        const rounded = Math.round(predAge);

        confirmedAge = await new Promise(resolve => {
          goSlide(s => {
            s.innerHTML =
              makeDots('age') +
              '<p class="rv-eyebrow">We think you are about</p>' +
              '<p class="rv-big">' + rounded + '</p>' +
              '<p class="rv-conf">years old — enter your actual age below</p>' +
              '<div class="rv-age-wrap">' +
                '<input type="number" id="rvAgeInp" value="0">' +
                '<span class="rv-hint">enter your real age</span>' +
              '</div>' +
              '<div class="rv-btns">' +
                '<button type="button" class="rv-btn is-yes" id="rvAgeSave">Confirm age</button>' +
              '</div>';
            const inp = s.querySelector('#rvAgeInp');
            inp.focus();
            inp.select();
            // Send the literal value, no clamp: a left-at-0 (or blank) commit saves
            // 0 so pure click-throughs are filterable, and junk like -20 saves as-is.
            const save = () => resolve(parseInt(inp.value, 10) || 0);
            s.querySelector('#rvAgeSave').addEventListener('click', save);
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
          });
        });

        if (Math.abs(confirmedAge - predAge) <= 3) summary.correct += 1;
        postJson('/survey/' + encodeURIComponent(surveyId) + '/age', {
          pred_value: predAge, confirmed_value: confirmedAge,
        }).catch(e => console.warn('age post failed', e));
      } catch (err) {
        console.warn('age step failed', err);
      }

      // MOOD
      let predMood = null, confirmedMood = null;
      try {
        goSlide(s => {
          s.innerHTML = '<div class="rv-center"><div class="rv-spinner"></div><p class="rv-loading-label">Loading mood model…</p></div>';
        });
        const model = await loadModel(M('mood'));
        predMood = Math.max(0, Math.min(60, TreeWalker.score(model, features.mood)));
        const rounded = Math.round(predMood);

        confirmedMood = await new Promise(resolve => {
          goSlide(s => {
            s.innerHTML =
              makeDots('mood') +
              '<p class="rv-eyebrow">How are you feeling right now?</p>' +
              '<p class="rv-big" id="rvMoodWord">' + moodLabel(rounded) + '</p>' +
              '<div class="rv-slider-wrap">' +
                '<input type="range" id="rvMoodSlider" min="0" max="60" step="1" value="' + rounded + '">' +
                '<div class="rv-slider-labels"><span>Glum</span><span>Down</span><span>Okay</span><span>Happy</span></div>' +
              '</div>' +
              '<div class="rv-btns">' +
                '<button type="button" class="rv-btn is-yes" id="rvMoodSave">Confirm mood</button>' +
              '</div>';
            const slider = s.querySelector('#rvMoodSlider');
            const wordEl = s.querySelector('#rvMoodWord');
            slider.addEventListener('input', () => { wordEl.textContent = moodLabel(parseInt(slider.value, 10)); });
            s.querySelector('#rvMoodSave').addEventListener('click', () => resolve(parseInt(slider.value, 10)));
          });
        });

        if (Math.abs(confirmedMood - predMood) <= 10) summary.correct += 1;
        postJson('/survey/' + encodeURIComponent(surveyId) + '/mood', {
          pred_value: predMood, confirmed_value: confirmedMood,
        }).catch(e => console.warn('mood post failed', e));
      } catch (err) {
        console.warn('mood step failed', err);
      }

      // STATS
      showStatsSlide({
        w,
        confirmedGender,
        confirmedAge,
        confirmedMood,
        score: summary.correct,
        history: savedState.history,
        picks: savedState.picks,
        fromId: false,
        long: isLong,
        features,
      });
    }

    // ---- Entry point ----
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (id) {
        runIdFlow(id);
        return;
      }

      let savedState = null;
      try {
        const raw = localStorage.getItem('cpgResult');
        if (raw) {
          savedState = JSON.parse(raw);
          localStorage.removeItem('cpgResult');
        }
      } catch (_e) {}

      if (!savedState || !savedState.winner) {
        // No state and no ID — redirect to survey
        const s = document.createElement('div');
        s.className = 'rv-slide';
        wrap.appendChild(s);
        s.innerHTML = '<div class="rv-center"><p class="rv-error">No survey data found.<br><a href="survey">Take the survey</a></p></div>';
        requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('is-current')));
        return;
      }

      runRevealFlow(savedState);
    })();
  })();
  </script>
</body>
</html>
